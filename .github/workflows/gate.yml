name: dsh-base gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # The engine must prove itself before it is allowed to judge the repository.
      - name: Engine self-test
        run: node .dsh/base/dsb.mjs selftest

      - name: Syntax
        run: node .dsh/base/audit/check-syntax.mjs

      - name: Secret and provenance audit
        run: node .dsh/base/audit/scan-secrets.mjs

      - name: Integrity manifest
        run: node .dsh/base/audit/manifest.mjs --check

      - name: Unit tests
        run: node .dsh/base/audit/run-tests.mjs

      # Static governance: catalog, skills, module contracts, spec, ADRs,
      # attribute wiring, architecture edges, anti-patterns, traceability.
      - name: Definition of Done
        run: node .dsh/base/dsb.mjs dod

      - name: Architecture drift ratchet
        run: node .dsh/base/dsb.mjs arch-trend --gate

      - name: Decay scan (advisory)
        continue-on-error: true
        run: node .dsh/base/dsb.mjs risk

      - name: Doctor (diagnostic)
        if: always()
        run: node .dsh/base/dsb.mjs doctor

  # Real scanners wired once per push on one platform: findings are
  # platform-independent and the gate job already covers OS behaviour.
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks dir . --redact --no-banner

      - name: SAST (semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/ci

  # Test-strength metric. Node's native test coverage needs no dependency and
  # stays advisory: it reports, it never blocks.
  strength:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Coverage (advisory)
        run: node --experimental-test-coverage .dsh/base/audit/run-tests.mjs 2>&1 | tail -n 45
